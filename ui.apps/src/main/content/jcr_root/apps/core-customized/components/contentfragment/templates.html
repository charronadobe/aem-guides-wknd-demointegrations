<template
  data-sly-template.contentFragment="${@ fragment='The content fragment', fragmentPath='', wcmmode='WCM mode'}"
>
  <article
    id="${fragment.id}"
    class="cmp-contentfragment cmp-contentfragment--${fragment.name}"
    data-cmp-contentfragment-model="${fragment.type}"
    data-sly-attribute.data-cmp-contentfragment-path="${fragmentPath}"
    data-json="${!wcmmode.disabled && fragment.editorJSON}"
    data-cmp-data-layer="${fragment.data.json}"
  >
    <h3 class="cmp-contentfragment__title">${fragment.title}</h3>
    <sly data-sly-test="${fragment.description}">
      <p class="cmp-contentfragment__description">${fragment.description}</p>
    </sly>
    <!-- begin testing code: **THIS IS WHERE YOU NEED TO START, THE CONFRAG PATH IS HERE... HOW DO YOU GRAB THE SUBPATH AND PROCESS IT?** -->
    <!--/* <h1>
      isEmpty evaluates to ${!properties.fragmentPath} because it has the value
      ${properties.fragmentPath}
    </h1> */-->
    <!-- <h1>fragment.element.size is ${fragment.elements.size}</h1> -->
    <!-- end testing code -->
    <sly
      data-sly-test.isParagraphMode="${fragment.elements.size == 1 && fragment.elements[0].isMultiLine && properties.displayMode == 'singleText'}"
    >
      <sly data-sly-call="${paragraphs @ fragment=fragment}"></sly>
    </sly>
    <sly data-sly-test="${!isParagraphMode}">
      <sly data-sly-call="${elements @ fragment=fragment, wcmmode=wcmmode}"></sly>
    </sly>
  </article>
</template>

<!-- This template should not be used/called by the content fragment list component -->
<template data-sly-template.paragraphs="${@ fragment='The content fragment'}">
  <div class="cmp-contentfragment__elements">
    <!-- begin trace for ata-sly-template.paragraphs -->
    <!--/* <p>Templates (no Image list) before paragraph call</p> */-->
    <!-- end begin trace for ata-sly-template.paragraphs -->
    <div data-sly-resource="${'par0' @ resourceType=fragment.gridResourceType}"></div>
    <div data-sly-list="${fragment.paragraphs}">
      ${item @ context="html"}
      <div
        data-sly-resource="${'par{0}' @ format=itemList.count, resourceType=fragment.gridResourceType}"
      ></div>
    </div>
    <!-- stop trace for ata-sly-template.paragraphs -->
    <!--/* <p>Templates (no Image list) AFTER paragraph call</p> */-->
    <!-- end stop trace for ata-sly-template.paragraphs -->
  </div>
</template>

<template data-sly-template.elements="${@ fragment='The content fragment', wcmmode='WCM mode'}">
  <dl
    class="cmp-contentfragment__elements${!wcmmode.disabled ? ' cq-dd-contentfragment' : ''}"
    data-sly-list.element="${fragment.elements}"
    data-sly-use.elementTemplate="element.html"
  >
    <!-- begin trace for elementTemplate.element -->
    <!--/* <p>templates, before element call</p> */-->
    <!-- end trace for elementTemplate.element -->
    <sly data-sly-call="${elementTemplate.element @ element=element}"></sly>
  </dl>
  <!-- begin trace for elementTemplate.element -->
  <!--/* <p>templates, AFTER element call</p> */-->
  <!-- end trace for elementTemplate.element -->
</template>
<!-- I copied this from ./libs/core/wcm/components/contentfragment/v1/contentfragment/templates.html -->
<sly data-sly-template.placeholder="${@ isEmpty, classAppend, emptyTextAppend}">
  <div
    data-sly-test="${(wcmmode.edit || wcmmode.preview) && isEmpty}"
    class="cq-placeholder ${classAppend}"
    data-emptytext="${component.properties.jcr:title} - Empty"
  ></div>
</sly>
